name: Release

# Builds the installers and attaches them to a GitHub Release.
#
# Triggered by pushing a version tag:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The release is created as a DRAFT, so you can check the assets and write the
# notes before anyone sees it. Publish it from the Releases page when ready.
#
# Keep the tag in step with "version" in src-tauri/tauri.conf.json - that is
# what ends up in the installer filenames.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build installers (${{ matrix.platform }})
    permissions:
      contents: write # required to create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        # Windows only for now: it is the only platform the app has actually
        # been tested on. macOS and Linux runners can be added here once
        # someone has verified the app works there.
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds from scratch take several minutes; cache the target dir.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --ignore-scripts: better-sqlite3's install script is "node-gyp rebuild",
      # which compiles from source even though the package ships prebuilt
      # binaries for every platform it supports (including this one). That
      # compile is unnecessary and fails on some runners. esbuild's postinstall
      # is skipped for the same reason - the platform-specific @esbuild/*
      # package in the lockfile provides the binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Do not ship something that does not compile or whose tests fail.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DutyRoster ${{ github.ref_name }}
          releaseBody: |
            Windows installers are attached below.

            The `.msi` and the `-setup.exe` install the same application; pick
            whichever you prefer.

            These builds are not code-signed, so Windows SmartScreen will show
            a "Windows protected your PC" warning on first run. Choose
            **More info -> Run anyway** to continue. The warning means Windows
            does not recognise the publisher - not that it found anything wrong
            with the file.

            `SHA256SUMS.txt` below lists the checksum of each installer, so you
            can confirm your download is exactly what this build produced:

            ```powershell
            Get-FileHash .\DutyRoster_0.1.0_x64-setup.exe -Algorithm SHA256
            ```
          releaseDraft: true
          prerelease: false

      # Publish a checksum for every installer. This does not remove the
      # SmartScreen warning - only code signing does that - but it lets anyone
      # verify the file they downloaded is byte-for-byte what this build
      # produced, which is part of what signing would otherwise vouch for.
      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files = Get-ChildItem -Path $bundle -Recurse -File |
                   Where-Object { $_.Extension -in '.msi', '.exe' } |
                   Sort-Object Name
          # Fail loudly rather than publishing a release with no checksums.
          if (-not $files) { throw "No installers found under $bundle" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            # Two spaces between hash and name: the format "sha256sum -c" expects.
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          gh release upload $env:GITHUB_REF_NAME SHA256SUMS.txt --clobber
