name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # No Rust toolchain here on purpose: this job checks the TypeScript side
      # only, which is where essentially all the logic lives. Building the
      # Tauri host needs Rust and platform webview libraries, and belongs in a
      # separate release workflow.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
